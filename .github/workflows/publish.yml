name: Publish mmd-parser 1.1.0

on:
  push:
    tags:
      - v1.1.0

permissions:
  contents: read

concurrency:
  group: npm-release-1.1.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'takahirox/mmd-parser'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - name: Verify release tag and merged commit
        run: |
          node scripts/check-release.js
          git merge-base --is-ancestor HEAD origin/master
      - name: Install OIDC-compatible npm and existing dependencies
        run: |
          npm install --global npm@11.6.2 --registry=https://registry.npmjs.org
          npm install --no-package-lock --no-audit --no-fund
      - name: Build runtime bundles and declarations
        run: npm run build-uglify
      - name: Check strict types
        run: npm run typecheck
      - name: Test offline fixtures and bundles
        run: npm run test:offline
      - name: Test online MMD samples
        shell: bash
        run: |
          npm test | tee "$RUNNER_TEMP/mmd-parser-online.log"
          # The legacy smoke script logs metadata. Require all three parses to finish.
          grep -F "format: 'pmd'" "$RUNNER_TEMP/mmd-parser-online.log"
          grep -F "motionCount: 14160" "$RUNNER_TEMP/mmd-parser-online.log"
          grep -F "boneCount: 93" "$RUNNER_TEMP/mmd-parser-online.log"
      - name: Pack the release artifact
        run: npm pack --json --pack-destination "$RUNNER_TEMP"
      - name: Inspect and test the packed package
        run: npm run test:package -- "$RUNNER_TEMP/mmd-parser-1.1.0.tgz"
      - name: Publish the validated artifact with npm Trusted Publishing
        run: npm publish "$RUNNER_TEMP/mmd-parser-1.1.0.tgz" --access public --tag latest --registry=https://registry.npmjs.org
